<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="Portofolio"
      content="Portofolio website"
    />
    <meta name="description" content="Venu G Soganadgi - Senior Frontend Engineer specialising in React, TypeScript and the Palantir React OSDK / AIP platform" />
    <meta name="keywords" content="Senior Frontend Engineer, React, TypeScript, Palantir OSDK, Palantir AIP, Redux, Portfolio" />
    <meta property="og:title" content="Venu G Soganadgi - Senior Frontend Engineer" />
    <meta property="og:description" content="Portfolio showcasing frontend engineering work across React, TypeScript and the Palantir platform" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Venu G Soganadgi</title>
    <script>
      // Applies the saved theme before first paint so dark-mode visitors
      // never see a flash of the light theme. Keep the storage key in sync
      // with THEME_STORAGE_KEY in src/components/NavBar/NavBar.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var isDark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          /* localStorage unavailable - fall back to the light theme. */
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
